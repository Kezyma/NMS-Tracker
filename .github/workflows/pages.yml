name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A hand-edited file with a trailing comma deploys happily and then shows an error on the
      # page. The live site is case-sensitive where Windows is not, so an image named Ship.PNG
      # in the data and saved as ship.png works locally and breaks once deployed. A stat
      # misspelt in ranges.json quietly stops its meter using the range. And the board-wide
      # figures there must agree with the per-type ranges beneath them.
      - name: Every data file parses, every image exists, every range is sound
        shell: python
        run: |
          import json, pathlib, sys

          LOOKUPS = {'galaxies.json', 'ranges.json'}
          failed = False
          boards = {}
          for path in sorted(pathlib.Path('data').glob('*.json')):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except ValueError as error:
                  print(f'::error file={path}::{path} is not valid JSON: {error}')
                  failed = True
                  continue

              if path.name in LOOKUPS:
                  continue
              if not isinstance(data, list):
                  print(f'::error file={path}::{path} should be a list of entries')
                  failed = True
                  continue

              boards[path.stem] = [entry for entry in data if isinstance(entry, dict)]
              for entry in data:
                  image = str((entry.get('ImageUrl') if isinstance(entry, dict) else '') or '').strip()
                  if not image or image.startswith(('http://', 'https://')):
                      continue
                  name = image.replace(chr(92), '/').lstrip('/')  # chr(92) is a backslash
                  name = name[4:] if name.lower().startswith('img/') else name
                  if not (pathlib.Path('img') / name).is_file():
                      print(f"::error file={path}::{entry.get('Name')}: img/{name} does not exist "
                            f"(names are case-sensitive on the live site)")
                      failed = True

          def error(message):
              global failed
              print(f'::error file=data/ranges.json::{message}')
              failed = True

          def is_span(value):
              return (isinstance(value, list) and len(value) == 2
                      and all(isinstance(v, (int, float)) for v in value) and value[0] <= value[1])

          try:
              ranges = json.loads(pathlib.Path('data/ranges.json').read_text(encoding='utf-8'))
          except (OSError, ValueError):
              ranges = {}

          for board, limits in ranges.items():
              entries = boards.get(board)
              if entries is None:
                  if not pathlib.Path(f'data/{board}.json').exists():
                      error(f'"{board}" has no data/{board}.json')
                  continue  # otherwise it is there but broken, and already reported above

              # Total is the most the sum can be and Types holds the ranges: neither is a field.
              fields = {key for entry in entries for key in entry}
              types = limits.get('Types', {})
              stats = [key for key in limits if key not in ('Total', 'Types')]
              for stat in stats + sorted({s for spans in types.values() for s in spans} - set(stats)):
                  if fields and stat not in fields:
                      error(f'{board}: no entry has a field named "{stat}"')

              # Every range is [floor, limit], and the board's own figures are what they imply.
              sound = True
              for kind, spans in types.items():
                  for stat, span in spans.items():
                      if not is_span(span):
                          error(f'{board}: {kind} {stat} should be [floor, limit], not {span}')
                          sound = False
              if types and sound:
                  for stat in stats:
                      top = max((spans[stat][1] for spans in types.values() if stat in spans), default=None)
                      if top is not None and limits[stat] != top:
                          error(f'{board}: {stat} is {limits[stat]}, but the most any type reaches is {top}')
                  whole = [spans for spans in types.values() if all(s in spans for s in stats)]
                  if 'Total' in limits and whole:
                      top = max(sum(spans[s][1] for s in stats) for spans in whole)
                      if limits['Total'] != top:
                          error(f'{board}: Total is {limits["Total"]}, but the best any type can total is {top}')

              # An entry the ranges cannot place, or one that rolled outside them, is worth a look
              # but does not stop the deploy: the page marks it in red and carries on.
              if types and sound:
                  for entry in entries:
                      name, kind = entry.get('Name'), entry.get('Type')
                      if kind not in types:
                          print(f'::warning file=data/{board}.json::{name}: no range for type "{kind}" in ranges.json')
                          continue
                      for stat, (low, high) in types[kind].items():
                          value = entry.get(stat)
                          if isinstance(value, (int, float)) and not low <= value <= high:
                              print(f'::warning file=data/{board}.json::{name}: {stat} {value} is outside '
                                    f'the S-class {kind} range of {low} to {high}')

          sys.exit(1 if failed else 0)

      # The site lives under /NMS-Tracker/, so a path starting with / points outside it: it
      # works on localhost and 404s once deployed.
      - name: Every path is relative
        run: |
          if grep -nE '(href|src)="/[^/]' *.html \
             || grep -nE "data: *['\"]/" *.html \
             || grep -nE "url\(['\"]?/[^/]" css/*.css; then
            echo "::error::A path starts with / - make it relative, or it breaks under /NMS-Tracker/"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
